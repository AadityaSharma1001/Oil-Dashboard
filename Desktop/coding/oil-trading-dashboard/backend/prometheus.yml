global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "oil-desk-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"

  - job_name: "finbert-service"
    static_configs:
      - targets: ["finbert-service:8001"]
    metrics_path: "/metrics"
